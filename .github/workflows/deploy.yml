
name: Siteyi Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Paketleri yukle
        run: npm ci

      - name: Siteyi derle
        run: npm run build

      - name: Pages ayarla
        uses: actions/configure-pages@v5

      - name: Dosyalari hazirla
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Siteyi yayinla
        uses: actions/deploy-pages@v4
